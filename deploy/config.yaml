# resguard configuration.
#
# Every key is optional: if you delete one, its default value (the one shown
# here) is used. After editing this file:
#
#   sudo resguardd -check-config      check that it is valid
#   sudo systemctl reload resguard    apply the changes without losing history
#
# If the file has an error, the service keeps the previous configuration and
# reports it in the journal (journalctl -u resguard).

# How often a sample is taken (examples: 500ms, 2s, 1m).
interval: 2s

# How much sample history is kept in memory for "history" and "watch".
history: 1h

# Values above which a peak is recorded. 0 disables the alert.
# A peak ends when the value drops clearly below the threshold: 10 points for
# CPU, 5 for memory and to half the value for pressure (PSI).
thresholds:
  # CPU usage of the whole system, in %.
  cpu: 90
  # Memory in use, in %.
  memory: 90
  # Pressure (PSI): % of time in which tasks were waiting for the resource.
  # It detects contention even when usage does not look high.
  psi_cpu: 40
  psi_memory: 10
  psi_io: 30
  # Consecutive samples above the threshold needed to record the peak.
  # With an interval of 2s, sustain 2 ignores peaks shorter than about 4 seconds.
  sustain: 2

services:
  # Where to look for what to monitor (cgroup v2 slices):
  #   system.slice  system services and Docker containers
  #   user.slice    applications of desktop sessions (Chrome, VS Code…)
  # Remove user.slice if members of the resguard group should not see which
  # applications other users of this machine run.
  slices:
    - system.slice
    - user.slice
  # Units that never raise incidents (neither failures nor OOM kills). They
  # are matched against the unit name and accept wildcards, for example:
  #   "snap.*"     snap services
  #   "docker-*"   every Docker container
  #   "app-*"      every desktop application
  ignore: []
