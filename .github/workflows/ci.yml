name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only needs to read the code: if a third-party action were
# compromised, it could neither write to the repository nor publish anything.
permissions:
  contents: read

# A new push cancels the previous run on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The minimum version declared in go.mod and the latest stable one.
        go: [go.mod, stable]
    steps:
      # Actions are pinned by commit (not by tag, which their owner could move).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ matrix.go == 'go.mod' && 'go.mod' || '' }}
          go-version: ${{ matrix.go == 'stable' && 'stable' || '' }}

      # gofmt's alignment rules change between Go versions, so formatting is
      # checked with the latest stable Go only; tests run on both versions.
      - name: Formatting (gofmt)
        if: matrix.go == 'stable'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files (run 'make fmt'):"
            echo "$unformatted"
            exit 1
          fi

      - name: Static analysis (go vet)
        run: go vet ./...

      - name: Tests with the race detector
        run: go test -race -count=1 ./...

      - name: Build
        run: make build

      - name: The binaries contain no paths of the build machine
        run: |
          if grep -l "$HOME" bin/*; then
            echo "A binary contains local paths: -trimpath is missing from the build"
            exit 1
          fi

  vulns:
    name: Known vulnerabilities (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  packages:
    name: Packages (.deb/.rpm) and lintian
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.0
          args: release --snapshot --clean

      - name: lintian
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lintian
          lintian --fail-on warning --pedantic dist/*.deb

      - name: Install, upgrade and purge the .deb
        run: |
          deb=$(ls dist/resguard_*_amd64.deb)
          sudo apt-get install -y "./$deb"
          resguardctl version || true
          sudo resguardd -check-config
          systemctl is-enabled resguard
          systemctl is-active resguard
          resguardctl -socket /run/resguard/resguard.sock ping || sudo resguardctl ping
          sudo apt-get install -y --reinstall "./$deb"
          systemctl is-active resguard
          sudo apt-get purge -y resguard
          test ! -e /etc/resguard && test ! -e /usr/bin/resguardd
