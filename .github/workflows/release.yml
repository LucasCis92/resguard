name: Release

# Runs when a version tag is pushed:
#   git tag v0.1.0 && git push origin v0.1.0
# It builds, packages (.deb, .rpm, .tar.gz) and creates a DRAFT GitHub release
# with provenance attestations. Review the draft and publish it by hand.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # An "environment" can require manual approval before this job gets write
    # permissions: Settings → Environments → release → Required reviewers.
    environment: release
    permissions:
      contents: write # create the draft release and upload the packages
      id-token: write # sign the attestations with the workflow's identity
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # GoReleaser needs the history for the changelog
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false # no cache for releases: everything is built from scratch

      - name: Check that the tag matches the package changelog
        run: |
          tag="${GITHUB_REF_NAME#v}"
          first=$(grep -m1 -oP '^- semver: \K\S+' deploy/package/changelog.yml)
          if [ "$tag" != "$first" ]; then
            echo "The tag is v$tag but the latest entry of deploy/package/changelog.yml is $first."
            echo "Add an entry for $tag before publishing."
            exit 1
          fi

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Provenance attestation: lets anyone verify that each package was built
      # in this repository, by this workflow, from this tag:
      #   gh attestation verify <package> --repo LucasCis92/resguard
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/SHA256SUMS
