# GoReleaser configuration: builds, packages (.deb, .rpm, .tar.gz) and
# publishes releases. Local dry run without publishing: make package
version: 2

project_name: resguard

before:
  hooks:
    - go mod tidy -diff
    - go test ./...
    # Compressed man pages, as Debian requires (gzip -n: no timestamp, reproducible).
    - mkdir -p build/man/es
    - sh -c "gzip -9nc deploy/man/resguardctl.1 > build/man/resguardctl.1.gz"
    - sh -c "gzip -9nc deploy/man/resguardd.8 > build/man/resguardd.8.gz"
    - sh -c "gzip -9nc deploy/man/es/resguardctl.1 > build/man/es/resguardctl.1.gz"
    - sh -c "gzip -9nc deploy/man/es/resguardd.8 > build/man/es/resguardd.8.gz"

builds:
  - id: resguardd
    main: ./cmd/resguardd
    binary: resguardd
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/LucasCis92/resguard/internal/version.Version=v{{ .Version }}
    # Reproducible build: same source, same binary.
    mod_timestamp: "{{ .CommitTimestamp }}"
  - id: resguardctl
    main: ./cmd/resguardctl
    binary: resguardctl
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/LucasCis92/resguard/internal/version.Version=v{{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - README.es.md
      - src: deploy/systemd/resguard.service
        dst: deploy/systemd/resguard.service
      - src: deploy/sysusers.d/resguard.conf
        dst: deploy/sysusers.d/resguard.conf
      - src: deploy/config.yaml
        dst: deploy/config.yaml
      - src: deploy/man/*
        dst: man

nfpms:
  - id: paquetes
    package_name: resguard
    # Packaging revision (0.1.0-1): bump it when the package changes but the
    # program does not.
    release: "1"
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: LucasCis92
    maintainer: LucasCis92 <151865990+LucasCis92@users.noreply.github.com>
    homepage: https://github.com/LucasCis92/resguard
    license: MIT
    description: |-
      Resource monitor and incident recorder for Linux services.
      resguard monitors CPU, memory, swap, pressure (PSI) and the usage of every
      service, application and container; it records resource peaks, OOM kills
      and service failures together with the system state at that moment, and
      offers an interactive CLI (resguardctl) with a live view. The interface is
      available in English and Spanish.
    section: admin
    priority: optional
    formats: [deb, rpm]
    bindir: /usr/bin
    dependencies:
      - systemd
    contents:
      - src: deploy/systemd/resguard.service
        dst: /usr/lib/systemd/system/resguard.service
        file_info: {mode: 0644}
      - src: deploy/sysusers.d/resguard.conf
        dst: /usr/lib/sysusers.d/resguard.conf
        file_info: {mode: 0644}
      # The administrator's configuration: upgrades never overwrite it.
      - src: deploy/config.yaml
        dst: /etc/resguard/config.yaml
        type: config|noreplace
        file_info: {mode: 0644}
      - src: LICENSE
        dst: /usr/share/licenses/resguard/LICENSE
        file_info: {mode: 0644}
        packager: rpm
      - src: deploy/package/copyright
        dst: /usr/share/doc/resguard/copyright
        file_info: {mode: 0644}
        packager: deb
      - src: README.md
        dst: /usr/share/doc/resguard/README.md
        file_info: {mode: 0644}
      - src: README.es.md
        dst: /usr/share/doc/resguard/README.es.md
        file_info: {mode: 0644}
      - src: build/man/resguardctl.1.gz
        dst: /usr/share/man/man1/resguardctl.1.gz
        file_info: {mode: 0644}
      - src: build/man/resguardd.8.gz
        dst: /usr/share/man/man8/resguardd.8.gz
        file_info: {mode: 0644}
      - src: build/man/es/resguardctl.1.gz
        dst: /usr/share/man/es/man1/resguardctl.1.gz
        file_info: {mode: 0644}
      - src: build/man/es/resguardd.8.gz
        dst: /usr/share/man/es/man8/resguardd.8.gz
        file_info: {mode: 0644}
      - src: deploy/package/deb/lintian-overrides
        dst: /usr/share/lintian/overrides/resguard
        file_info: {mode: 0644}
        packager: deb
    changelog: deploy/package/changelog.yml
    # Debian and Fedora manage services with different tools.
    overrides:
      deb:
        scripts:
          postinstall: deploy/package/deb/postinst
          preremove: deploy/package/deb/prerm
          postremove: deploy/package/deb/postrm
      rpm:
        scripts:
          postinstall: deploy/package/rpm-postinstall.sh
          preremove: deploy/package/rpm-preremove.sh
          postremove: deploy/package/rpm-postremove.sh

checksum:
  name_template: SHA256SUMS
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}~dev+{{ .ShortCommit }}"

changelog:
  sort: asc
  filters:
    exclude: ["^Merge"]

release:
  draft: true
  footer: |
    ## Installation

    Ubuntu / Debian:

        sudo apt install ./resguard_{{ .Version }}-1_amd64.deb

    Fedora / RHEL:

        sudo dnf install ./resguard-{{ .Version }}-1.x86_64.rpm

    Verify that the package was built by this repository:

        gh attestation verify resguard_{{ .Version }}-1_amd64.deb --repo LucasCis92/resguard

    Spanish documentation: [README.es.md](https://github.com/LucasCis92/resguard/blob/v{{ .Version }}/README.es.md)
